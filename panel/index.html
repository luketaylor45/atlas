<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Atlas</title>
    <script>
      // Apply the saved mode (light/dark) and theme (layout) before the first
      // paint so the page never flashes the wrong colours or layout. Kept in
      // sync with src/context/theme.ts.
      (function () {
        var preference = 'system';
        var layout = 'classic';
        try {
          preference = localStorage.getItem('atlas-theme') || 'system';
          layout = localStorage.getItem('atlas-layout') || 'classic';
        } catch (e) {}
        var dark = preference === 'dark' ||
          (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (!/^(classic|horizon|compact|glass)$/.test(layout)) layout = 'classic';
        var root = document.documentElement;
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        root.setAttribute('data-layout', layout);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
