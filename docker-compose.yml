#version: '3.8'

services:
  # Atlas Core API
  core:
    build:
      context: ./core
      dockerfile: Dockerfile
    container_name: atlas_core
    restart: always
    ports:
      - "127.0.0.1:${ATLAS_CORE_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - ENVIRONMENT=production
      # Leave JWT_SECRET empty to let Atlas generate and store a signing secret.
      - JWT_SECRET=${JWT_SECRET:-}
      - REGISTRATION_ENABLED=${REGISTRATION_ENABLED:-false}
      # The time zone schedules run in, for example Europe/London.
      - TZ=${ATLAS_TIMEZONE:-UTC}
      - DATABASE_URL=host=database user=${DB_USER:-atlas} password=${DB_PASS:-atlas_password} dbname=${DB_NAME:-atlas} port=5432 sslmode=disable
    depends_on:
      - database
    volumes:
      - ./eggs:/app/eggs

  # Atlas Database
  database:
    image: postgres:16-alpine
    container_name: atlas_db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-atlas}
      - POSTGRES_PASSWORD=${DB_PASS:-atlas_password}
      - POSTGRES_DB=${DB_NAME:-atlas}
    volumes:
      - atlas_db_data:/var/lib/postgresql/data

  # Atlas Panel (Frontend)
  panel:
    build:
      context: ./panel
      dockerfile: Dockerfile
    container_name: atlas_panel
    restart: always
    ports:
      - "127.0.0.1:${ATLAS_PANEL_PORT:-4000}:80"
    depends_on:
      - core

  # Atlas Daemon (Local Node)
  # IMPORTANT: The daemon requires a specific token generated by the Panel.
  # Deployment: Start the stack, create a node in Admin > Nodes, copy the token to .env, then restart.
  daemon:
    build:
      context: ./daemon
      dockerfile: Dockerfile
    container_name: atlas_daemon
    restart: always
    ports:
      # The daemon API is only for Core, which reaches it over the Compose
      # network as "daemon:8081". It is published on loopback only. A daemon
      # serving a remote Core must set ATLAS_NODE_BIND to an address that only
      # that Core can reach (a private or VPN interface), never 0.0.0.0.
      - "${ATLAS_NODE_BIND:-127.0.0.1}:${ATLAS_NODE_PORT:-8081}:8081"
      - "0.0.0.0:${ATLAS_SFTP_PORT:-2022}:2022" # SFTP MUST be public
    environment:
      - PORT=8081
      - CORE_URL=http://core:8080
      - NODE_TOKEN=${NODE_TOKEN:-change-me}
      - SFTP_PORT=2022
      - DATA_PATH=/var/lib/atlas/data
      - HOST_DATA_PATH=${DATA_PATH:-/var/lib/atlas/data}
      - SERVER_UID=${SERVER_UID:-1000}
      - SERVER_GID=${SERVER_GID:-1000}
      - INSTALL_TIMEOUT_MINUTES=${INSTALL_TIMEOUT_MINUTES:-120}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_PATH:-/var/lib/atlas/data}:/var/lib/atlas/data
    depends_on:
      - core

volumes:
  atlas_db_data:
